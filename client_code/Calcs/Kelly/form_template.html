<div class="cx">
  <p class="cx-intro">The share of capital per bet that maximises long-run growth, given how often you win and how much a win pays compared with a loss. Real edges are uncertain, so many people bet half Kelly or less.</p>
  <div class="cx-grid">
    <div class="cx-inputs">
      <label class="ui-field cx-field"><span>Chance of winning, %</span>
        <anvil-component type="TextBox" name="p_box" prop:text="55" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Average win divided by average loss</span>
        <anvil-component type="TextBox" name="b_box" prop:text="1.5" prop:role='["cx-num"]'></anvil-component><span class="ui-hint">1.5 means wins are one and a half times the size of losses.</span>
      </label>
    </div>
    <div class="cx-out">
      <anvil-component type="Label" name="msg" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
      <div class="mi-sheet cx-sheet" anvil:name="out_box">
        <div class="mi-sheet-head"><span>Kelly fraction</span><span>Result</span></div>
        <anvil-component type="RepeatingPanel" name="out_panel" prop:item_template="Master_Investor.Items.SheetRow" prop:role='["sheet-rows"]'></anvil-component>
      </div>
    </div>
  </div>
  <div class="cx-chart">
    <anvil-component type="Label" name="chart_title" prop:role='["cx-chart-title"]'></anvil-component>
    <anvil-component type="Master_Investor.Components.LineChart" name="chart"></anvil-component>
  </div>
</div>
