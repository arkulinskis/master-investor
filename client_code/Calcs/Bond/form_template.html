<div class="cx">
  <p class="cx-intro">The price of a plain bond from its coupon, the market yield and the years left, plus its duration: roughly how much the price moves for each 1% change in yield.</p>
  <div class="cx-grid">
    <div class="cx-inputs">
      <label class="ui-field cx-field"><span>Face value</span>
        <anvil-component type="TextBox" name="face_box" prop:text="1000" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Coupon, % a year</span>
        <anvil-component type="TextBox" name="coupon_box" prop:text="5" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Market yield, % a year</span>
        <anvil-component type="TextBox" name="yield_box" prop:text="6" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Years to maturity</span>
        <anvil-component type="TextBox" name="years_box" prop:text="5" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Payments per year</span>
        <anvil-component type="TextBox" name="freq_box" prop:text="2" prop:role='["cx-num"]'></anvil-component><span class="ui-hint">2 for most government and corporate bonds.</span>
      </label>
    </div>
    <div class="cx-out">
      <anvil-component type="Label" name="msg" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
      <div class="mi-sheet cx-sheet" anvil:name="out_box">
        <div class="mi-sheet-head"><span>Bond price</span><span>Result</span></div>
        <anvil-component type="RepeatingPanel" name="out_panel" prop:item_template="Master_Investor.Items.SheetRow" prop:role='["sheet-rows"]'></anvil-component>
      </div>
    </div>
  </div>
  <div class="cx-chart">
    <anvil-component type="Label" name="chart_title" prop:role='["cx-chart-title"]'></anvil-component>
    <anvil-component type="Master_Investor.Components.LineChart" name="chart"></anvil-component>
  </div>
</div>
