<div class="cx">
  <p class="cx-intro">What a starting sum plus a monthly amount grows to, compounding monthly, what the yearly fee takes along the way, and what the result is worth in today's money after inflation.</p>
  <div class="cx-grid">
    <div class="cx-inputs">
      <label class="ui-field cx-field"><span>Starting amount</span>
        <anvil-component type="TextBox" name="start_box" prop:text="10000" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Added each month</span>
        <anvil-component type="TextBox" name="monthly_box" prop:text="250" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Yearly return, %</span>
        <anvil-component type="TextBox" name="rate_box" prop:text="7" prop:role='["cx-num"]'></anvil-component><span class="ui-hint">Long-run stock returns have been higher than this, with big swings; bonds lower.</span>
      </label>
      <label class="ui-field cx-field"><span>Years</span>
        <anvil-component type="TextBox" name="years_box" prop:text="25" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Yearly fee, %</span>
        <anvil-component type="TextBox" name="fee_box" prop:text="0.5" prop:role='["cx-num"]'></anvil-component><span class="ui-hint">A fund's expense ratio plus any adviser or platform fee. Taken from the whole balance every year.</span>
      </label>
      <label class="ui-field cx-field"><span>Inflation, % a year</span>
        <anvil-component type="TextBox" name="infl_box" prop:text="2.5" prop:role='["cx-num"]'></anvil-component>
      </label>
    </div>
    <div class="cx-out">
      <anvil-component type="Label" name="msg" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
      <div class="mi-sheet cx-sheet" anvil:name="out_box">
        <div class="mi-sheet-head"><span>Compound growth</span><span>Result</span></div>
        <anvil-component type="RepeatingPanel" name="out_panel" prop:item_template="Master_Investor.Items.SheetRow" prop:role='["sheet-rows"]'></anvil-component>
      </div>
    </div>
  </div>
  <div class="cx-chart">
    <anvil-component type="Label" name="chart_title" prop:role='["cx-chart-title"]'></anvil-component>
    <anvil-component type="Master_Investor.Components.LineChart" name="chart"></anvil-component>
  </div>
</div>
