<div class="cx">
  <p class="cx-intro">Paste a list of period returns (monthly by default) to get annual return, volatility, Sharpe, Sortino and the worst drawdown. Returns are in %, separated by commas or spaces.</p>
  <div class="cx-grid">
    <div class="cx-inputs">
      <label class="ui-field cx-field"><span>Returns, % per period</span>
        <anvil-component type="TextArea" name="returns_box" prop:text="2.1, -1.4, 3.0, 0.8, -2.6, 1.9, 4.2, -0.7, 1.1, -3.4, 2.8, 1.5" prop:role='["cx-num"]'></anvil-component>
      </label>
      <label class="ui-field cx-field"><span>Periods per year</span>
        <anvil-component type="TextBox" name="ppy_box" prop:text="12" prop:role='["cx-num"]'></anvil-component><span class="ui-hint">12 for monthly returns, 52 weekly, 252 daily.</span>
      </label>
      <label class="ui-field cx-field"><span>Risk-free rate, % a year</span>
        <anvil-component type="TextBox" name="rf_box" prop:text="3" prop:role='["cx-num"]'></anvil-component>
      </label>
    </div>
    <div class="cx-out">
      <anvil-component type="Label" name="msg" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
      <div class="mi-sheet cx-sheet" anvil:name="out_box">
        <div class="mi-sheet-head"><span>Sharpe and Sortino</span><span>Result</span></div>
        <anvil-component type="RepeatingPanel" name="out_panel" prop:item_template="Master_Investor.Items.SheetRow" prop:role='["sheet-rows"]'></anvil-component>
      </div>
    </div>
  </div>
  <div class="cx-chart">
    <anvil-component type="Label" name="chart_title" prop:role='["cx-chart-title"]'></anvil-component>
    <anvil-component type="Master_Investor.Components.LineChart" name="chart"></anvil-component>
  </div>
</div>
