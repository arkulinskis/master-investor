    <noscript><div class="seo-noscript">
    <h1>Master Investor: learn investing, from first fund to quant</h1>
    <p>Free investing lessons from beginner to quant: valuing companies, DCF, data sources, risk, trading and backtesting, with reveal-the-answer cards and calculators.</p>
    <p>Master Investor is a free course in investing, from your first index fund to how quantitative investors work. Nine tracks and 54 short lessons cover foundations, reading financial statements, valuing a company (multiples, discounted cash flow, discount rates, reverse DCF, moats), markets and instruments, macro, portfolio and risk, trading, the quant&#x27;s world (factors, backtesting, statistical arbitrage, execution, machine learning, option pricing) and where investing data comes from.</p>
    <p>Every lesson ends with question cards whose answers stay hidden until you reveal them. You answer in your head, reveal, and say whether you knew it; cards you know come back after days or weeks, cards you miss come back sooner. A placement check suggests where to start. Seven calculators (compound growth, DCF with a sensitivity grid, bond price and duration, option payoff, Sharpe and Sortino, position size, Kelly) and a library of data sources, open-source GitHub projects and books round it out. It is education, not financial advice.</p>
    <p>Who it's for: Beginners starting to invest, self-directed investors who want to value companies, and traders moving toward quantitative methods</p>
    <h2>What it does</h2><ul><li>9 tracks, 54 lessons and 432 hide-and-reveal question cards, beginner to pro</li><li>Spaced-repetition review schedule, daily streak and progress per track</li><li>A 12-card placement check that suggests where to start</li><li>Seven calculators: compound growth, DCF, bond price, option payoff, Sharpe and Sortino, position size, Kelly</li><li>A library of 32 data sources, 31 open-source GitHub projects and 18 books</li><li>A glossary of every key term, linked to its lesson</li></ul>
    <h2>Questions</h2><h3>Is Master Investor free?</h3><p>Yes. Every lesson, card, calculator and the library are free; an account is only needed to save progress.</p><h3>Is it financial advice?</h3><p>No. It teaches how investing works and how professionals think, with made-up example companies. It never recommends what to buy or sell.</p><h3>Who is it for?</h3><p>Complete beginners, self-directed investors who want to value companies, and traders who want the quantitative side: factors, backtesting, execution and option pricing.</p><h3>How do the reveal cards work?</h3><p>You read a question, answer it in your head, press Reveal, then mark Got it or Not yet. Known cards return after 1, 3, 7, 16 and 35 days; missed cards return sooner.</p><h3>Where does investing data come from?</h3><p>The Data and tools track and the library cover filings (SEC EDGAR, company reports), macro data (FRED, central banks), price sources and their limits, APIs, and the pitfalls that ruin research.</p>
    <p><a href="https://master-investor.anvil.app/about">About Master Investor</a> &middot; <a href="https://master-investor.anvil.app/llms.txt">Master Investor for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Master Investor needs JavaScript in your browser.</p>
    </div></noscript>
